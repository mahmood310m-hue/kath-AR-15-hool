name: Build Kawthar APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Create Android WebView Project
        run: |
          mkdir -p android/app/src/main/java/com/kawthar/school
          mkdir -p android/app/src/main/assets
          
          # Copy index.html to assets
          cp index.html android/app/src/main/assets/ || echo "<h1>الكوثر</h1>" > android/app/src/main/assets/index.html
          
          # AndroidManifest.xml
          cat > android/app/src/main/AndroidManifest.xml << 'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.kawthar.school">
            <uses-permission android:name="android.permission.INTERNET"/>
            <application android:label="مدرسة الكوثر" android:theme="@android:style/Theme.NoTitleBar">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          
          # MainActivity.java - WebView
          cat > android/app/src/main/java/com/kawthar/school/MainActivity.java << 'EOF'
          package com.kawthar.school;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          public class MainActivity extends Activity {
            protected void onCreate(Bundle b) {
              super.onCreate(b);
              WebView w = new WebView(this);
              w.getSettings().setJavaScriptEnabled(true);
              w.getSettings().setDomStorageEnabled(true);
              w.setWebViewClient(new WebViewClient());
              w.loadUrl("file:///android_asset/index.html");
              setContentView(w);
            }
          }
          EOF
          
          # build.gradle
          cat > android/app/build.gradle << 'EOF'
          apply plugin: 'com.android.application'
          android {
            compileSdkVersion 33
            defaultConfig {
              applicationId "com.kawthar.school"
              minSdkVersion 21
              targetSdkVersion 33
              versionCode 1
              versionName "1.0"
            }
            buildTypes { release { minifyEnabled false } debug { minifyEnabled false } }
          }
          EOF
          
          # settings.gradle
          cat > android/settings.gradle << 'EOF'
          include ':app'
          EOF
          
          # gradle wrapper
          mkdir -p android/gradle/wrapper
          cat > android/gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.0-all.zip
          EOF
          
          cat > android/build.gradle << 'EOF'
          buildscript {
            repositories { google(); mavenCentral() }
            dependencies { classpath 'com.android.tools.build:gradle:7.4.2' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF
          
          # Download gradle wrapper jar
          wget -q https://github.com/gradle/gradle/raw/master/gradle/wrapper/gradle-wrapper.jar -O android/gradle/wrapper/gradle-wrapper.jar || true
          
          cat > android/gradlew << 'EOF'
          #!/bin/sh
          exec java -jar $(dirname $0)/gradle/wrapper/gradle-wrapper.jar "$@"
          EOF
          chmod +x android/gradlew

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kawthar-school-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
