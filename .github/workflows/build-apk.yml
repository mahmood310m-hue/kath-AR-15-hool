name: Build Kawthar APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Create Android Project
        run: |
          rm -rf android
          mkdir -p android/app/src/main/java/com/kawthar/school
          mkdir -p android/app/src/main/assets
          mkdir -p android/gradle/wrapper
          
          cp index.html android/app/src/main/assets/ || echo "<h1>Kawthar</h1>" > android/app/src/main/assets/index.html
          
          cat > android/app/src/main/AndroidManifest.xml << 'MAN'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.kawthar.school">
            <uses-permission android:name="android.permission.INTERNET"/>
            <application android:label="الكوثر">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          MAN
          
          cat > android/app/src/main/java/com/kawthar/school/MainActivity.java << 'JAVA'
          package com.kawthar.school;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          public class MainActivity extends Activity {
            protected void onCreate(Bundle b) {
              super.onCreate(b);
              WebView w = new WebView(this);
              w.getSettings().setJavaScriptEnabled(true);
              w.getSettings().setDomStorageEnabled(true);
              w.getSettings().setAllowFileAccess(true);
              w.setWebViewClient(new WebViewClient());
              w.loadUrl("file:///android_asset/index.html");
              setContentView(w);
            }
          }
          JAVA
          
          cat > android/app/build.gradle << 'GRADLE'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.kawthar.school'
              compileSdk 33
              defaultConfig {
                  applicationId "com.kawthar.school"
                  minSdk 21
                  targetSdk 33
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes {
                  release { minifyEnabled false }
                  debug { minifyEnabled false }
              }
          }
          GRADLE
          
          cat > android/settings.gradle << 'SG'
          include ':app'
          SG
          
          cat > android/build.gradle << 'BG'
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.1.0' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          BG
          
          echo "distributionUrl=https://services.gradle.org/distributions/gradle-8.0-all.zip" > android/gradle/wrapper/gradle-wrapper.properties
          
          cat > android/gradlew << 'GW'
          #!/bin/sh
          DIR=$(dirname $0)
          exec java -jar $DIR/gradle/wrapper/gradle-wrapper.jar "$@"
          GW
          chmod +x android/gradlew
          
          wget -q https://services.gradle.org/distributions/gradle-8.0-all.zip -O /tmp/g.zip || true
          wget -q https://github.com/gradle/gradle/raw/v8.0.0/gradle/wrapper/gradle-wrapper.jar -O android/gradle/wrapper/gradle-wrapper.jar || curl -sL https://services.gradle.org/distributions/gradle-8.0-bin.zip -o /tmp/skip.zip || true
          ls -lh android/gradle/wrapper/

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew wrapper --gradle-version 8.0 || true
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kawthar-school-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
