name: Build Kawthar APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install
        run: npm install

      - name: Clean old android
        run: rm -rf android

      - name: Add Android fresh
        run: npx cap add android

      - name: Copy and Sync
        run: |
          npx cap copy android
          npx cap sync android
          ls -la android/
          ls -la android/capacitor.settings.gradle || echo "still missing"

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kawthar-school-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
